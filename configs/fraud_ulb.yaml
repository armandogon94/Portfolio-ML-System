# Payment fraud: ULB Credit Card Fraud from OpenML dataset 1597.
#
# This is the credential-free real-data path: no Kaggle account, no rules gate.
#
# OpenML documents Time as seconds since the first transaction and marks it as
# the row-id attribute. Scikit-learn omits row ids from fetch_openml().frame, so
# src/data/download.py restores Time from the exact cached ARFF before this
# chronological split is built.
problem: fraud
seed: 42

data:
  source:
    kind: openml
    data_id: 1597
    adapter: src.data.adapters.ulb_creditcard
  sample_path: data/sample/ulb_creditcard_sample.csv
  processed_path: data/processed/fraud_ulb.parquet
  target: is_fraud
  denylist:
    - is_fraud
    - Class

split:
  type: time
  column: Time
  test_size: 0.2
  val_size: 0.1

features:
  module: src.features.ulb_features

model:
  type: lightgbm
  params:
    objective: binary
    metric: average_precision
    learning_rate: 0.03
    num_leaves: 31
    min_child_samples: 50
    feature_fraction: 0.9
    bagging_fraction: 0.9
    bagging_freq: 1
    n_estimators: 1000
    early_stopping_rounds: 75
    n_jobs: 8
    verbose: -1

baselines:
  - type: prior
  - type: logreg
    params:
      max_iter: 1000
      class_weight: balanced

metrics:
  primary: pr_auc
  report:
    - pr_auc
    - roc_auc
    - precision_at_1pct
    - recall_at_1pct_fpr
    - brier

# No expected range was registered before the first corrected temporal run.
# Adding one after seeing that run would be post hoc. Publication is guarded by
# the degenerate-score test and the same-split logistic baseline comparison.

training:
  checkpoint_dir: checkpoints/fraud_ulb
  reports_dir: reports
  mlflow_experiment: fintech-ml-system
  refit_full_after_cv: true
