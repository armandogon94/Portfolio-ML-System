problem: h1b_approval

data:
  raw_data_path: data/raw/h1b_approval.csv
  processed_data_path: data/processed/h1b_approval.csv
  n_samples: 50000
  test_size: 0.2
  random_seed: 42

features:
  numerical:
    - prevailing_wage
    - soc_code_level
    - employer_size_tier
    - job_level
    - education_level
    - experience_years
    - country_of_citizenship_tier
    - employer_prior_approval_rate
  target: is_approved

model:
  type: xgboost
  params:
    max_depth: 5
    learning_rate: 0.1
    n_estimators: 200
    objective: "binary:logistic"
    eval_metric: auc
    subsample: 0.8
    colsample_bytree: 0.8

training:
  checkpoint_dir: checkpoints/h1b_approval
  results_dir: results
  wandb_project: portfolio-ml-system
  wandb_tags:
    - h1b_approval
    - xgboost
    - classification
    - legal
