problem: delivery_eta

data:
  raw_data_path: data/raw/delivery_eta.csv
  processed_data_path: data/processed/delivery_eta.csv
  n_samples: 30000
  test_size: 0.2
  random_seed: 42

features:
  numerical:
    - distance_km
    - package_weight_kg
    - traffic_congestion
    - weather_severity
    - time_of_day
    - day_of_week
    - carrier_priority
    - origin_destination_tier
  target: eta_hours

model:
  type: xgboost
  params:
    max_depth: 6
    learning_rate: 0.1
    n_estimators: 200
    objective: "reg:squarederror"
    eval_metric: rmse
    subsample: 0.8
    colsample_bytree: 0.8

training:
  checkpoint_dir: checkpoints/delivery_eta
  results_dir: results
  wandb_project: portfolio-ml-system
  wandb_tags:
    - delivery_eta
    - xgboost
    - regression
    - logistics
