problem: dental_noshow

data:
  raw_data_path: data/raw/dental_noshow.csv
  processed_data_path: data/processed/dental_noshow.csv
  n_samples: 5000
  test_size: 0.2
  random_seed: 42

features:
  numerical:
    - age
    - prior_no_shows
    - days_until_appointment
    - appointment_hour
    - distance_km
    - insurance_type
    - procedure_complexity
    - prior_appointments
  target: is_no_show

model:
  type: xgboost
  params:
    max_depth: 5
    learning_rate: 0.1
    n_estimators: 200
    objective: "binary:logistic"
    eval_metric: auc
    subsample: 0.8
    colsample_bytree: 0.8

training:
  checkpoint_dir: checkpoints/dental_noshow
  results_dir: results
  wandb_project: portfolio-ml-system
  wandb_tags:
    - dental_noshow
    - xgboost
    - classification
