name: CI

on:
  push:
    branches: [main, "rebuild/**"]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: python (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # --frozen proves uv.lock is committed AND resolves. Before this repo
      # tracked the lockfile, `docker build` failed at `COPY ... uv.lock`.
      - name: Sync (frozen)
        run: uv sync --frozen --extra dev

      - name: Lint
        run: |
          uv run ruff check src/ scripts/ tests/
          uv run ruff format --check src/ scripts/ tests/

      - name: Types
        run: uv run mypy src/

      # The network exclusion is HERE, visibly, and not hidden in pyproject's
      # addopts. The previous version buried `-m 'not network and not parity'`
      # in config, which silently deselected the Kaggle canary and the pre-ship
      # gate: 360 green tests, two of which had never run.
      - name: Tests (committed fixtures only, no credentials)
        run: uv run pytest -m "not network" --cov=src --cov-report=term-missing --cov-fail-under=80

  web:
    name: web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  docker:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build API image (fails if uv.lock is not tracked)
        run: docker build -f infra/docker/api.Dockerfile -t ml-api:ci .
      - name: Build web image
        run: docker build -f infra/docker/web.Dockerfile -t ml-web:ci .

  docs:
    name: docs integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The 0.964 retraction is load-bearing. If someone deletes the correction
      # section, or reintroduces a placeholder, CI fails.
      - name: No placeholders, no resurrected claims
        run: |
          set -e
          ! grep -n "YOUR_USERNAME" README.md
          ! grep -nE "localhost:8000|localhost:3000|all 20 cataloged" README.md
          ! grep -nE "^\s*Live:" README.md
          ! grep -rn "TODO(copy)" web/lib/ || true
          grep -q "docs/adr/0003-real-data-over-synthetic.md" README.md
          grep -q "A correction, and why it's here" README.md

      - name: Every relative README link resolves to a real file
        run: |
          set -e
          grep -oE '\]\(([^)#h][^)]*)\)' README.md | sed -E 's/^\]\(//; s/\)$//' | while read -r p; do
            [ -e "${p%%#*}" ] || { echo "BROKEN LINK: $p"; exit 1; }
          done

      - name: Every Mermaid block has an exported SVG
        run: |
          n=$(grep -c '```mermaid' README.md || true)
          s=$(ls docs/diagrams/*.svg 2>/dev/null | wc -l)
          [ "$n" -le "$s" ] || { echo "Mermaid blocks: $n, SVGs: $s"; exit 1; }

      # No synthetic label may re-enter the metric path. This is the single
      # rule that makes the whole rebuild worth having done.
      # Matches a MODULE or an IMPORT, not prose. ADR-0003 and the fixture
      # script both name the deleted generators in explanatory comments, and
      # forbidding the words would push the project toward not explaining
      # itself — which is the opposite of the point.
      - name: No synthetic data generator has returned
        run: |
          set -e
          ! ls src/data/generate_*.py 2>/dev/null
          ! grep -rnE "^\s*(from|import)\s+.*generate_(fraud|credit_risk|customer_churn|housing)" src/ scripts/ tests/
          ! grep -rnE "generate_(fraud|credit_risk|customer_churn)\s*\(" src/ scripts/ configs/

  verify:
    name: fresh-clone verify
    runs-on: ubuntu-latest
    needs: [python, docker]
    steps:
      - uses: actions/checkout@v4
        with:
          # The verifier clones the repo from itself, so it needs real history.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Clone HEAD into a throwaway dir and run the documented quickstart
        run: ./scripts/verify_fresh_clone.sh
