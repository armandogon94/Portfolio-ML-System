name: CI

on:
  push:
    branches: [main, "rebuild/**"]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: python (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # --frozen proves uv.lock is committed AND resolves. Before this repo
      # tracked the lockfile, `docker build` failed at `COPY ... uv.lock`.
      - name: Sync (frozen)
        run: uv sync --frozen --extra dev --python "${{ matrix.python-version }}"

      - name: Set up Node for diagram rendering
        if: matrix.python-version == '3.11'
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Diagram text containment
        if: matrix.python-version == '3.11'
        run: make diagrams-check

      - name: Publication evidence
        if: matrix.python-version == '3.11'
        run: make publication-check

      - name: Lint
        run: |
          uv run ruff check src/ scripts/ tests/
          uv run ruff format --check src/ scripts/ tests/

      - name: Types
        run: uv run mypy src/

      # The network exclusion is HERE, visibly, and not hidden in pyproject's
      # addopts. The previous version buried `-m 'not network and not parity'`
      # in config, which silently deselected the Kaggle canary and the pre-ship
      # gate: a green suite in which two required gates had never run.
      - name: Tests (committed fixtures only, no credentials)
        run: uv run pytest -m "not network" --cov=src --cov-report=term-missing --cov-fail-under=80

  web:
    name: web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  docker:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build API image (fails if uv.lock is not tracked)
        run: docker build -f infra/docker/api.Dockerfile -t ml-api:ci .
      - name: Build web image
        run: docker build -f infra/docker/web.Dockerfile -t ml-web:ci .

  docs:
    name: docs integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5

      # The historical correction no longer belongs in README. CI still blocks
      # the retired 0.964 metric, placeholder copy, and unsupported claims while
      # requiring the ADR that documents why the metric was retired.
      - name: No placeholders, no resurrected claims
        run: |
          set -e
          if grep -n "0\.964" README.md; then
            echo "README resurrected the retired 0.964 metric."
            exit 1
          fi
          if grep -n "YOUR_USERNAME" README.md; then
            echo "README contains the placeholder repository owner."
            exit 1
          fi
          if grep -nE "localhost:8000|localhost:3000|all 20 cataloged" README.md; then
            echo "README contains a retired endpoint or catalog claim."
            exit 1
          fi
          if grep -nE "^\s*Live:" README.md; then
            echo "README contains an unsupported live-deployment claim."
            exit 1
          fi
          if grep -rn "TODO(copy)" web/lib/; then
            echo "Tracked placeholder copy remains in web/lib/."
            exit 1
          fi
          grep -q "docs/adr/0003-real-data-over-synthetic.md" README.md

      - name: Every relative README link resolves to a real file
        run: |
          uv run --no-project python - <<'PY'
          import re
          from pathlib import Path

          failures = []
          for document in (Path("README.md"), Path("web/README.md")):
              for raw_target in re.findall(r"\]\(([^)]+)\)", document.read_text()):
                  target = raw_target.strip().strip("<>")
                  if target.startswith(("#", "http://", "https://", "mailto:")):
                      continue
                  relative = target.split("#", 1)[0]
                  if relative and not (document.parent / relative).exists():
                      failures.append(f"{document}: {target}")
          if failures:
              raise SystemExit("BROKEN LINK(S):\n" + "\n".join(failures))
          PY

      - name: Every Mermaid block has an exported SVG
        run: |
          n=$(grep -c '```mermaid' README.md || true)
          s=$(ls docs/diagrams/*.svg 2>/dev/null | wc -l)
          [ "$n" -le "$s" ] || { echo "Mermaid blocks: $n, SVGs: $s"; exit 1; }

      # No synthetic label may re-enter the metric path. This is the single
      # rule that makes the whole rebuild worth having done.
      # Matches a MODULE or an IMPORT, not prose. ADR-0003 and the fixture
      # script both name the deleted generators in explanatory comments, and
      # forbidding the words would push the project toward not explaining
      # itself, which is the opposite of the point.
      - name: No synthetic data generator has returned
        run: |
          set -e
          if ls src/data/generate_*.py 2>/dev/null; then
            echo "A synthetic data generator has returned."
            exit 1
          fi
          if grep -rnE "^\s*(from|import)\s+.*generate_(fraud|credit_risk|customer_churn|housing)" src/ scripts/ tests/; then
            echo "Production or test code imports a retired synthetic generator."
            exit 1
          fi
          if grep -rnE "generate_(fraud|credit_risk|customer_churn)\s*\(" src/ scripts/ configs/; then
            echo "Production code calls a retired synthetic generator."
            exit 1
          fi

  verify:
    name: fresh-clone verify
    runs-on: ubuntu-latest
    needs: [python, docker]
    steps:
      - uses: actions/checkout@v4
        with:
          # The verifier clones the repo from itself, so it needs real history.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Clone HEAD into a throwaway dir and run the documented quickstart
        run: ./scripts/verify_fresh_clone.sh
