[project]
name = "portfolio-ml-system"
version = "1.0.0"
description = "Production ML system with credit risk, fraud detection, price prediction, and demand forecasting"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    # ML Frameworks
    "torch>=2.2",
    "xgboost>=2.0",
    "lightgbm>=4.0",
    "scikit-learn>=1.4",

    # Data
    "pandas>=2.1",
    "numpy>=1.26",
    "faker>=22.0",

    # Streaming datasets (Phase A.1 — real Kaggle/HF data without repo bloat)
    "kagglehub>=0.3",
    "datasets>=2.18",

    # Experiment Tracking
    "wandb>=0.16",
    "mlflow>=2.10",

    # Explainability
    "shap>=0.44",

    # Config
    "pyyaml>=6.0",

    # Visualization
    "matplotlib>=3.8",
    "plotly>=5.18",

    # Web UI
    "gradio>=4.15",

    # API
    "fastapi>=0.109",
    "uvicorn>=0.27",

    # Utilities
    "rich>=13.7",
    "tqdm>=4.66",
    "joblib>=1.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.lint.per-file-ignores]
"tests/conftest.py" = ["E402", "I001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--cov=src --cov-report=term-missing --tb=short -q -m 'not network and not parity'"
markers = [
    "network: tests that hit real external APIs (Kaggle/HF); skipped by default, run with '-m network'",
    "parity: pre-ship regression gates against committed JSON snapshots (require real checkpoints); skipped by default, run with '-m parity'",
]

[tool.coverage.run]
source = ["src"]
omit = ["src/__pycache__/*"]

[tool.coverage.report]
show_missing = true
fail_under = 0
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.",
    "if TYPE_CHECKING:",
]
