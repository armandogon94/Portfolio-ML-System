[project]
name = "portfolio-ml-system"
version = "2.0.0"
description = "Fintech ML system: payment fraud, consumer credit risk and card attrition on real public data"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    # ML Frameworks
    "torch>=2.2",
    "xgboost>=2.0",
    "lightgbm>=4.0",
    "scikit-learn>=1.4",

    # Data
    "pandas>=2.1",
    "numpy>=1.26",
    "pyarrow>=15.0",

    # Real dataset acquisition. kagglehub>=0.3.4 is the floor for
    # competition_download(): IEEE-CIS is a competition, not a dataset,
    # and dataset_download() physically cannot fetch it.
    "kagglehub>=0.3.4",

    # Experiment Tracking
    "wandb>=0.16",
    "mlflow>=2.10",

    # Explainability
    "shap>=0.44",

    # Config
    "pyyaml>=6.0",

    # Figures under reports/figures (scripts/make_figures.py).
    "matplotlib>=3.8",

    # API
    "fastapi>=0.109",
    "uvicorn>=0.27",

    # Utilities
    "rich>=13.7",
    "tqdm>=4.66",
    "joblib>=1.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.2",
    "mypy>=1.9",
    "httpx>=0.27",          # fastapi.testclient
    "playwright>=1.51,<2",  # reproducible README screenshots
    "types-PyYAML>=6.0",
    "pandas-stubs>=2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.lint.per-file-ignores]
"tests/conftest.py" = ["E402", "I001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# NOTE: no `-m` filter here. The previous version hid `-m 'not network and not
# parity'` in this line, which silently deselected the Kaggle canary AND the
# pre-ship gate: 360 green tests, two of which never ran. Network exclusion now
# lives visibly in .github/workflows/ci.yml as `-m "not network"`.
addopts = "--cov=src --cov-report=term-missing --tb=short -q"
markers = [
    "network: hits a real external API (Kaggle). Excluded in CI via -m 'not network'.",
]

[tool.coverage.run]
source = ["src"]
omit = ["src/__pycache__/*"]

[tool.coverage.report]
show_missing = true
fail_under = 80
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.",
    "if TYPE_CHECKING:",
]

[tool.mypy]
python_version = "3.11"
files = ["src"]
ignore_missing_imports = true      # lightgbm, shap, kagglehub and mlflow ship no stubs
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
