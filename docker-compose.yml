# Self-contained development stack — no external dependencies.
# Run: docker compose up --build
# See docker-compose.prod.yml for production config (PostgreSQL, Traefik).

services:
  # MLflow Experiment Tracking Server (SQLite backend for dev)
  mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    container_name: ml-system-mlflow
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --default-artifact-root file:///mlflow/artifacts
    volumes:
      - mlflow_data:/mlflow
    ports:
      - "${MLFLOW_TRACKING_PORT:-5070}:5000"
    networks:
      - ml-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:5000/')\""]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 10s

  # Prediction API Server (FastAPI)
  ml-api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: ml-system-api
    depends_on:
      mlflow:
        condition: service_healthy
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - LOG_FORMAT=json
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - PYTORCH_ENABLE_MPS_FALLBACK=1
    ports:
      - "${BACKEND_PORT:-8070}:8000"
    networks:
      - ml-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ML Dashboard UI (Gradio)
  ml-ui:
    build:
      context: .
      dockerfile: Dockerfile.ui
    container_name: ml-system-ui
    depends_on:
      ml-api:
        condition: service_healthy
    environment:
      - GRADIO_SERVER_NAME=0.0.0.0
      - GRADIO_SERVER_PORT=7860
      - PYTORCH_ENABLE_MPS_FALLBACK=1
    ports:
      - "${FRONTEND_PORT:-3070}:7860"
    networks:
      - ml-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7860/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  mlflow_data:
    driver: local

networks:
  ml-network:
    driver: bridge
