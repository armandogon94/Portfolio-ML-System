# Self-contained stack: MLflow + FastAPI + Next.js. No external dependencies.
#
#   make docker-up        ->  docker compose -f infra/compose/base.yml up -d
#
# Build context is the REPOSITORY ROOT, not this directory, because the
# Dockerfiles copy src/, configs/ and data/sample/. Hence `context: ../..`.
#
# Host ports come from .env with the values in docs/ports.example.md. The
# container-internal ports are the framework defaults (8000, 3070) — container
# network namespaces are isolated, so only the host side needs allocating.

services:
  # MLflow Experiment Tracking Server (SQLite backend for dev)
  mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    container_name: ml-system-mlflow
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --default-artifact-root file:///mlflow/artifacts
    volumes:
      - mlflow_data:/mlflow
    ports:
      - "${MLFLOW_TRACKING_PORT:-5070}:5000"
    networks:
      - ml-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:5000/')\""]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 10s

  # Prediction API Server (FastAPI)
  ml-api:
    build:
      context: ../..
      dockerfile: infra/docker/api.Dockerfile
    container_name: ml-system-api
    depends_on:
      mlflow:
        condition: service_healthy
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - LOG_FORMAT=json
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - PYTORCH_ENABLE_MPS_FALLBACK=1
    volumes:
      # Checkpoints are gitignored and are NOT baked into the image — training
      # happens on the host (where LightGBM has all the cores) and the API picks
      # the result up through this mount. A fresh clone with no checkpoints
      # starts fine and reports every model as unavailable.
      - ../../checkpoints:/app/checkpoints:ro
    ports:
      - "${BACKEND_PORT:-8070}:8000"
    networks:
      - ml-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ML Demo UI (Next.js + shadcn/ui) — three fintech model pages
  # plus the live /dashboard. Replaced the Gradio prototype — see
  # docs/adr/0001-gradio-to-nextjs.md. Proxies /api/* to
  # ml-api via next.config.mjs rewrites so the browser stays on a
  # single origin (no CORS preflight, no backend middleware).
  ml-web:
    build:
      context: ../..
      dockerfile: infra/docker/web.Dockerfile
    container_name: ml-system-web
    depends_on:
      ml-api:
        condition: service_healthy
    environment:
      - INTERNAL_API_URL=http://ml-api:8000
      - NODE_ENV=production
    ports:
      - "${WEB_PORT:-3070}:3070"
    networks:
      - ml-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://localhost:3070/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  mlflow_data:
    driver: local

networks:
  ml-network:
    driver: bridge
