# dev.yml — override layer for local development.
#
# Applied on top of base.yml:
#   make docker-dev-up
#   docker compose -f infra/compose/base.yml -f infra/compose/dev.yml up
#
# Currently only overrides ml-web (replaces `node server.js` with
# `pnpm dev` so saved file changes hot-reload). The rest of the stack
# (mlflow, ml-api) stays production-style since those don't change
# as often during frontend iteration.
#
# Primary dev flow is native `make web-dev` (fastest, no container
# filesystem overhead). This override is the offline fallback — use
# it when you don't have Node installed locally, or want to verify
# the containerized HMR path specifically.

services:
  ml-web:
    build:
      context: ../..
      dockerfile: infra/docker/web.Dockerfile
      target: builder  # stop before runner — we need the full deps tree for dev
    command: pnpm dev -p 3070
    environment:
      - NODE_ENV=development
      - INTERNAL_API_URL=http://ml-api:8000
    volumes:
      # Mount the source tree so edits reflect inside the container.
      - ../../web:/app/web
      # Anonymous volume shadows node_modules so the container keeps
      # its own (built for Linux/Alpine) rather than the host's
      # (built for macOS), which would cause native-binary mismatches.
      - /app/web/node_modules
    working_dir: /app/web
    # HMR responds to file changes; the Dockerfile HEALTHCHECK from
    # the base compose still applies. start_period bumped because
    # `pnpm dev` cold-starts slower than `next start`.
    healthcheck:
      start_period: 60s
